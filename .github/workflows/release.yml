name: Build release draft
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签，例如 v1.2.0；留空使用 manifest.json 版本'
        required: false
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build extension and Windows helper
        shell: pwsh
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
        run: |
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { 'v' + $manifest.version }
          ./tools/build-release.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -OutDirectory "$env:GITHUB_WORKSPACE/dist" -ReleaseTag $tag
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Attach packages to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "优课学习助手 $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create release draft.' }
          }
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          $package = 'dist/uooc-helper-' + $version + '.zip'
          gh release upload $env:RELEASE_TAG $package "dist/uooc-updater-windows.zip" "dist/SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Cannot upload release assets; check duplicate or immutable assets.' }
